  transparent: false
  sessionAccent: true
  separator: powerline-thin
  preset: full
branchSummary:
  enabled: false
bash:
  enabled: true
theme:
  dark: moss
recap:
  enabled: false
features:
  unexpectedStopDetection: true
compaction:
  idleEnabled: true
  idleTimeoutSeconds: 300
providers:
  memoryModel: online
mnemopi:
  proactiveLinking: true
autolearn:
  enabled: true
  autoContinue: true
lsp:
  diagnosticsOnEdit: true
bashInterceptor:
  enabled: true
shellMinimizer:
  sourceOutlineLevel: default
searxng:
  endpoint: https://search.svc.olympus.lewont.in
browser:
  headless: false
  cmux: false
  enabled: false
