modelRoles:
  default: github-copilot/claude-sonnet-4.6
  task: github-copilot/gpt-5.3-codex
  plan: github-copilot/gpt-5.5
  slow: github-copilot/gpt-5.5
  smol: github-copilot/claude-haiku-4.5
retry:
  fallbackChains:
    default:
      - github-copilot/gpt-5.4
    task:
      - github-copilot/claude-sonnet-4.6
      - github-copilot/gpt-5.4
    plan:
      - github-copilot/claude-opus-4.7
    slow:
      - github-copilot/claude-opus-4.7
    smol:
      - github-copilot/gpt-5.4-mini
memory:
  backend: mnemopi
task:
  enableLsp: true
  eager: always
  isolation:
    mode: auto
  showResolvedModelBadge: true
setupVersion: 1
symbolPreset: nerd
hideThinkingBlock: false
display:
  showTokenUsage: true
statusLine:
  transparent: false
  sessionAccent: true
  separator: powerline-thin
  preset: full
branchSummary:
  enabled: false
bash:
  enabled: true
theme:
  dark: moss
providers:
  memoryModel: online
  webSearch: searxng
searxng:
  endpoint: https://search.svc.olympus.lewont.in
recap:
  enabled: false
features:
  unexpectedStopDetection: true
compaction:
  idleEnabled: true
  idleTimeoutSeconds: 300
mnemopi:
  proactiveLinking: true
autolearn:
  enabled: true
  autoContinue: true
lsp:
  diagnosticsOnEdit: true
bashInterceptor:
  enabled: true
shellMinimizer:
  sourceOutlineLevel: default
