# omp agent config (work profile) — reconciled with live 2026-09-22.
# GitHub Copilot primary, OpenRouter as the cross-provider fallback tier.
modelRoles:
  default: github-copilot/claude-opus-5.5
  task: github-copilot/claude-sonnet-5.5
  plan: github-copilot/claude-opus-5.5:max
  slow: github-copilot/gpt-6-astra:max
  smol: github-copilot/claude-haiku-4.5
  vision: github-copilot/gemini-3.8-flash
  advisor: github-copilot/gpt-6-sol
  commit: github-copilot/gpt-5-mini
  memory: github-copilot/gpt-5-mini
  tiny: github-copilot/gpt-5-mini
  web: web/exa
  judge: openrouter/~typesafe/jev-latest
retry:
  usageAwareFallback: true
  fallbackChains:
    default:
      - github-copilot/gpt-6-sol
      - openrouter/moonshotai/kimi-k3
    task:
      - github-copilot/gpt-5.6-terra
      - openrouter/moonshotai/kimi-k3
    plan:
      - github-copilot/gpt-6-sol:max
      - openrouter/z-ai/glm-5.3
    slow:
      - github-copilot/claude-opus-5.5:max
      - openrouter/deepseek/deepseek-v4-pro
    smol:
      - github-copilot/gpt-6-luna
      - openrouter/z-ai/glm-5.3-flash
    vision:
      - github-copilot/claude-opus-5.5
      - openrouter/qwen/qwen3.8-max-prime
    advisor:
      - github-copilot/claude-sonnet-5.5
      - openrouter/z-ai/glm-5.3
    commit:
      - github-copilot/gpt-6-luna
      - openrouter/deepseek/deepseek-v4.1-flash
    memory:
      - github-copilot/gpt-6-luna
      - openrouter/deepseek/deepseek-v4.1-flash
    tiny:
      - github-copilot/gpt-5-mini
      - openrouter/qwen/qwen3.8-flash
    web:
      - web/duckduckgo
      - web/searxng
    judge:
      - "@smol"
memory:
  backend: mnemopi
mnemopi:
  proactiveLinking: true
  polyphonicRecall: true
  scoping: per-project-tagged
autolearn:
  enabled: true
  autoContinue: true
task:
  enableLsp: true
  eager: always
  isolation:
    enabled: true
  showResolvedModelBadge: true
isolation:
  backend: auto
lsp:
  diagnosticsOnEdit: true
bash:
  enabled: true
bashInterceptor:
  enabled: true
shellMinimizer:
  sourceOutlineLevel: default
searxng:
  endpoint: https://search.svc.olympus.lewont.in
compaction:
  idleEnabled: true
  idleTimeoutSeconds: 300
features:
  unexpectedStopDetection: smart
recap:
  enabled: false
branchSummary:
  enabled: false
display:
  showTokenUsage: true
  showTurnTime: true
  pinnedAgents: full
statusLine:
  preset: full
  separator: powerline-thin
  sessionAccent: true
  transparent: false
symbolPreset: nerd
hideThinkingBlock: false
theme:
  dark: moss
composer:
  shape: claude
dev:
  autoqaConsent: denied
setupVersion: 2
